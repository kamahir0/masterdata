name: Apply execution handoff contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-execution-handoff-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply workflow contract changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {text.count(old)} for {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          workflow = "docs/execution-workflow.md"
          agents = "AGENTS.md"
          test = "crates/xtask/tests/execution_state.rs"

          replace_once(
              workflow,
              "同じagentがそのまま`implement-spec`を実行してよい。",
              "同じagentがimplementationを担当してよい。\n\nただし、短い「進めて」等のcontinuation promptで`NON_IMPLEMENTATION` activityを開始したturn中にreadiness gateを満たして`implementation-ready`へ到達した場合、そのturnのままimplementationへ進んではならない（MUST NOT）。後述のActivity class boundaryで停止してExecution Handoffを返し、次の短いcontinuation promptまたはHumanの明示的なcross-boundary指示でimplementationを開始する。"
          )

          anchor = "Humanから「進めて」等の短い指示を受けたagentはPre-action freshness gate後にStageを読み、原則として次のactivityを行う。\n\n"
          addition = anchor + """### Activity class and continuation boundary

各Stageには、agent topologyとは独立したderivedなActivity classを1つだけ割り当てる。Activity classはDevelopment Stateへ保存せず、freshなStageから機械的に導出する。

- `IMPLEMENTATION`: production / test / fixture等の実装変更を主目的として行うactivity。`implementation-ready`と`correction-ready`だけが該当する。
- `NON_IMPLEMENTATION`: design / specification / approval reflection / verification / priority selection等。`designing`、`decision-required`、`verification-ready`、`objective-complete`が該当する。

短い「進めて」「continue」等のcontinuation promptは、**prompt受領時のStageに対応するActivity classを1回進める指示**として解釈する。activity中にStageが別のActivity classへ遷移した時点で、そのturnは停止してExecution Handoffを返さなければならない（MUST）。特に`NON_IMPLEMENTATION`から`IMPLEMENTATION`へ自動で跨いではならず（MUST NOT）、`IMPLEMENTATION`から`NON_IMPLEMENTATION`へ到達した後にverificationまで連続実行してもならない（MUST NOT）。

Humanが「承認後そのまま実装まで」「実装して検証まで」のようにcross-boundary continuationを明示した場合だけ、指定された範囲でこのstop boundaryを跨いでよい（MAY）。単に「進めて」とだけ言われた場合はcross-boundary authorizationと解釈してはならない（MUST NOT）。

"""
          replace_once(workflow, anchor, addition)

          old_table = """| Development Stage | 次のactivity | 2-agent運用で推奨するlane |
| --- | --- | --- |
| `designing` | design / specificationを進める | 本流側 |
| `decision-required` | Human decisionを整理・提示し、回答後にcanonical authorityへ反映する | 本流側 |
| `implementation-ready` | Current Objectiveを実装してcandidate化する | 実装側 |
| `verification-ready` | recorded Candidateをfinal verificationする | 本流側 |
| `correction-ready` | recorded Blockingだけを修正して新candidate化する | 実装側 |
| `objective-complete` | 次priority候補を比較・推薦しHuman decisionへ戻る | 本流側 |
"""
          new_table = """| Development Stage | Activity class | 次のactivity | 2-agent運用で推奨するlane |
| --- | --- | --- | --- |
| `designing` | `NON_IMPLEMENTATION` | design / specificationを進める | 本流側 |
| `decision-required` | `NON_IMPLEMENTATION` | Human decisionを整理・提示し、回答後にcanonical authorityへ反映する | 本流側 |
| `implementation-ready` | `IMPLEMENTATION` | Current Objectiveを実装してcandidate化する | 実装側 |
| `verification-ready` | `NON_IMPLEMENTATION` | recorded Candidateをfinal verificationする | 本流側 |
| `correction-ready` | `IMPLEMENTATION` | recorded Blockingだけを修正して新candidate化する | 実装側 |
| `objective-complete` | `NON_IMPLEMENTATION` | 次priority候補を比較・推薦しHuman decisionへ戻る | 本流側 |
"""
          replace_once(workflow, old_table, new_table)

          old_handoff = """Humanが「タスクを整理して」「次はどっち」「何を動かせばよい」等を尋ねた場合、およびrepository activity後のstatus / completion reportでは、agentはfreshなDevelopment Stateから少なくとも次を明示する。

```text
現在: <Stage>
次のactivity: <Stageから導出したactivity>
2-agent運用: <本流側 | 実装側>
```

`decision-required`ではこれに加えて具体的なHuman decisionを提示する。`Candidate`、Blocking、CI等の重要なcurrent contextは必要に応じて併記してよいが、HumanへStage名だけを返してlaneを推測させてはならない。
"""
          new_handoff = """Current Objectiveに関するdevelopment activityを行ったagentのfinal response、およびHumanが「タスクを整理して」「次はどっち」「何を動かせばよい」等を尋ねた場合のstatus responseは、通常の説明文の有無にかかわらず、末尾にfreshなDevelopment Stateから導出した次の`Execution Handoff` blockを必ず含めなければならない（MUST）。

```text
Execution Handoff
Current stage: <Stage>
Next activity: <Stageから導出したactivity>
Next activity class: <IMPLEMENTATION | NON_IMPLEMENTATION>
Human action required: <yes | no>
Short \"進める\" means: <次の短いcontinuation promptで実行する内容>
Stop boundary: <このactivityが停止すべきStageまたは条件>
2-agent lane: <本流側 | 実装側>
```

`Human action required`は`decision-required`、`objective-complete`でのpriority選定、その他具体的なHuman decision / Approval待ちでは`yes`とし、それ以外は通常`no`とする。`decision-required`ではblockに加えて具体的なHuman decisionを本文で提示する。`Candidate`、Blocking、CI等の重要なcurrent contextは必要に応じて本文へ併記してよい。

`Short \"進める\" means`と`Stop boundary`はActivity class boundaryをHumanが予測できる具体度で書く。HumanへStage名だけ、またはlaneだけを返して次がimplementationかnon-implementationかを推測させてはならない（MUST NOT）。このresponse contractはagent間handoffをHumanが転送するためではなく、Humanが管理AIとimplementation AIを分離して運用する場合にも次の起動先を機械的に判断できるようにするためのprojectionである。
"""
          replace_once(workflow, old_handoff, new_handoff)

          agent_anchor = "Humanから「進めて」等の短い指示を受けたagentは、conversationの前回stateではなくfresh repositoryのCurrent ObjectiveとDevelopment Stateを読み、[`docs/execution-workflow.md`](docs/execution-workflow.md)のstage semanticsに従って現在可能なactivityを進める。\n\n"
          agent_addition = agent_anchor + """Stageから導出されるActivity classは二値であり、`implementation-ready` / `correction-ready`は`IMPLEMENTATION`、それ以外は`NON_IMPLEMENTATION`とする。短い「進めて」はprompt受領時のActivity classを1回進める意味であり、activity中にclassが変わるStageへ到達したらそこで停止する。Humanがcross-boundary continuationを明示していない限り、`NON_IMPLEMENTATION`から`IMPLEMENTATION`へ、またはその逆へ同じturnで自動継続してはならない（MUST NOT）。

Current Objectiveに関するdevelopment activityまたはstatus responseのfinal responseでは、`docs/execution-workflow.md`で定義された`Execution Handoff` blockを必ず出力し、少なくとも`Current stage`、`Next activity`、`Next activity class`、`Human action required`、`Short \"進める\" means`、`Stop boundary`、`2-agent lane`を明示する（MUST）。これらはfresh Stageから導出するprojectionであり、`docs/execution-state.md`へactor routingとして保存してはならない。

"""
          replace_once(agents, agent_anchor, agent_addition)

          replace_once(
              agents,
              "implementation-ready後は、同じagentが`implement-spec`で実装を続けても、execution environment / cost / capability上有益なら別agentへdelegateしてもよい。",
              "implementation-ready後は、同じagentが次のimplementation activityを担当しても、execution environment / cost / capability上有益なら別agentへdelegateしてもよい。ただし、`NON_IMPLEMENTATION` activity中にimplementation-readyへ到達した同じturnで、短い「進めて」だけを根拠に実装へ跨いではならない。"
          )

          test_path = Path(test)
          test_text = test_path.read_text()
          test_text = test_text.replace('"現在: <Stage>",\n        "次のactivity: <Stageから導出したactivity>",\n        "2-agent運用: <本流側 | 実装側>",', '"Execution Handoff",\n        "Next activity: <Stageから導出したactivity>",\n        "Next activity class: <IMPLEMENTATION | NON_IMPLEMENTATION>",\n        "Short \\\"進める\\\" means:",\n        "Stop boundary:",\n        "2-agent lane: <本流側 | 実装側>",')
          if test_text == test_path.read_text():
              raise SystemExit("execution_state.rs: expected handoff assertion block was not replaced")
          test_text = test_text.replace(
              '"実装側を動かすのは`implementation-ready`と`correction-ready`、それ以外は本流側",',
              '"実装側を動かすのは`implementation-ready`と`correction-ready`、それ以外は本流側",\n        "## Activity class and continuation boundary",\n        "`IMPLEMENTATION`: production / test / fixture等の実装変更を主目的",\n        "`NON_IMPLEMENTATION`: design / specification / approval reflection / verification / priority selection等",\n        "単に「進めて」とだけ言われた場合はcross-boundary authorizationと解釈してはならない",'
          )
          agents_assert = '    assert!(agents.contains("docs/execution-workflow.md"));\n'
          agents_new = agents_assert + '''    for required in [\n        "Next activity class",\n        "Short \\\"進める\\\" means",\n        "activity中にclassが変わるStageへ到達したらそこで停止",\n        "Execution Handoff",\n    ] {\n        assert!(\n            agents.contains(required),\n            "AGENTS.md lost execution handoff policy: {required}"\n        );\n    }\n'''
          if test_text.count(agents_assert) != 1:
              raise SystemExit("execution_state.rs: AGENTS assertion anchor mismatch")
          test_text = test_text.replace(agents_assert, agents_new, 1)
          test_path.write_text(test_text)
          PY
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workflow integrity test
        run: cargo test -p xtask --test execution_state
      - name: Commit changes and remove runner
        shell: bash
        run: |
          rm .github/workflows/apply-execution-handoff-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/execution-workflow.md crates/xtask/tests/execution_state.rs .github/workflows/apply-execution-handoff-contract.yml
          git commit -m "AI execution handoff contractを明示する"
          git push origin HEAD:main

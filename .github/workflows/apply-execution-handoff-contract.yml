name: Apply execution handoff contract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-execution-handoff-contract.yml
      - .github/scripts/apply_execution_handoff.py
      - .github/scripts/fix_execution_handoff_test.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply contract changes
        run: |
          python3 .github/scripts/apply_execution_handoff.py
          python3 .github/scripts/fix_execution_handoff_test.py
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workflow integrity test
        run: cargo test -p xtask --test execution_state
      - name: Commit changes and remove temporary runner
        shell: bash
        run: |
          rm .github/workflows/apply-execution-handoff-contract.yml
          rm .github/scripts/apply_execution_handoff.py
          rm .github/scripts/fix_execution_handoff_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/execution-workflow.md crates/xtask/tests/execution_state.rs .github/workflows/apply-execution-handoff-contract.yml .github/scripts/apply_execution_handoff.py .github/scripts/fix_execution_handoff_test.py
          git commit -m "AI execution handoff contractを明示する"
          git push origin HEAD:main

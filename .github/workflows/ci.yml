name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu primary quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          # Tauri v2 prerequisites for Ubuntu/Noble. The legacy
          # libappindicator3-dev package conflicts with this Ayatana package.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: cargo xtask check-all

  windows:
    name: Windows platform quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: cargo xtask check-platform

  macos:
    name: macOS platform quality gate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: cargo xtask check-platform

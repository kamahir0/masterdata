name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu core, frontend, .NET, and GUI compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          # Tauri v2 prerequisites for Ubuntu/Noble. The legacy
          # libappindicator3-dev package conflicts with this Ayatana package.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - name: Restore minimal application lib diff
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          content = subprocess.check_output(
              ["git", "show", "origin/main:crates/masterdata-app/src/lib.rs"],
              text=True,
          )
          content = content.replace("mod publish;", "mod authoring;\nmod publish;", 1)
          content = content.replace("pub use publish::{", "pub use authoring::*;\npub use publish::{", 1)
          Path("crates/masterdata-app/src/lib.rs").write_text(content)
      - name: Format Rust for artifact handoff
        run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            apps/gui/src-tauri/src/lib.rs
            crates/masterdata-app/src/authoring.rs
            crates/masterdata-app/src/lib.rs
            crates/masterdata-core/src/lib.rs
            crates/masterdata-core/src/source_edit.rs
      - run: cargo xtask check-wasm
      - run: cargo xtask check-all

  windows:
    name: Windows repository quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: cargo xtask check-all

  macos:
    name: macOS repository quality gate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: npm ci
      - run: cargo xtask check-all

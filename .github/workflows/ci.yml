name: Fast CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Rust and Cargo cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust library lint
        run: cargo clippy --workspace --exclude masterdata-gui --lib -- -D warnings
      - name: Rust library tests
        run: cargo test --workspace --exclude masterdata-gui --lib
      - name: Frontend typecheck
        run: npm run frontend:lint
      - name: Frontend boundary smoke
        run: node --test apps/gui/tests/app.test.mjs

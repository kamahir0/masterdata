name: Record mutation correction

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: record-mutation-correction
  cancel-in-progress: true

jobs:
  correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply narrow verification corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('apps/gui/src/App.tsx')
          app = app_path.read_text()
          before = "              edits: preview.changed ? latest.edits : {},\n              preview,\n"
          after = "              edits: preview.changed ? latest.edits : {},\n              addedRecords: preview.changed ? latest.addedRecords : [],\n              pendingDeletes: preview.changed ? latest.pendingDeletes : [],\n              preview,\n"
          if app.count(before) != 1:
              raise SystemExit(f'expected one preview normalization site, found {app.count(before)}')
          app_path.write_text(app.replace(before, after))

          test_path = Path('apps/gui/tests/authoring.test.tsx')
          tests = test_path.read_text()

          def add_timeout(title: str, timeout: int) -> None:
              global tests
              marker = f"test('{title}', async () => {{"
              start = tests.find(marker)
              if start < 0:
                  raise SystemExit(f'test not found: {title}')
              end = tests.find('\n});', start)
              if end < 0:
                  raise SystemExit(f'test end not found: {title}')
              tests = tests[:end] + f'\n}}, {timeout:_});' + tests[end + len('\n});'):]

          add_timeout('Add Row creates an editable draft, validates it through the shared preview, and makes saved keys read-only', 10_000)
          add_timeout('deleting a new draft cancels the addition and returns the file to clean', 10_000)
          add_timeout('structural mutation state survives Failure, Conflict, and Outcome Unknown recovery', 20_000)

          insertion_marker = "test('deleting an edited existing row preserves the edit while Undo restores editability', async () => {"
          regression_lines = [
              "test('shared no-op preview normalizes structural mutation state back to clean', async () => {",
              "  openSnapshot = mutationSnapshot();",
              "  preview = async () => ({ candidateSource: openSnapshot.baseSource, changed: false, validation });",
              "  render(<App />);",
              "",
              "  fireEvent.click(await screen.findByRole('button', { name: 'Delete record 1', exact: true }));",
              "  expect(screen.getByText('Pending delete')).toBeTruthy();",
              "  await waitFor(() => expect(screen.getByText('Saved')).toBeTruthy());",
              "  expect(screen.queryByText('Pending delete')).toBeNull();",
              "  expect((screen.getByRole('textbox', { name: 'record 1 weight' }) as HTMLInputElement).readOnly).toBe(false);",
              "",
              "  fireEvent.click(screen.getByRole('button', { name: 'Add Row', exact: true }));",
              "  expect(await screen.findByRole('textbox', { name: 'new record id' })).toBeTruthy();",
              "  await waitFor(() => expect(screen.getByText('Saved')).toBeTruthy());",
              "  expect(screen.queryByRole('textbox', { name: 'new record id' })).toBeNull();",
              "}, 10_000);",
              "",
          ]
          regression = '\n'.join(regression_lines) + '\n'
          if insertion_marker not in tests:
              raise SystemExit('regression insertion marker not found')
          tests = tests.replace(insertion_marker, regression + insertion_marker, 1)

          old_mock = """  let saveResponse: any = { status: 'failure', snapshot: null, current: null, diagnostic: { code: 'E-IO', message: 'Cannot write source' } };\n  const normalInvoke = invoke.getMockImplementation()!;\n  invoke.mockImplementation(async (command, args) => command === 'save_data_file' ? saveResponse : normalInvoke(command, args));\n"""
          new_mock = """  let saveResponse: any = { status: 'failure', snapshot: null, current: null, diagnostic: { code: 'E-IO', message: 'Cannot write source' } };\n  let sourceResponse = { contentIdentity: 'base', source: openSnapshot.baseSource };\n  const normalInvoke = invoke.getMockImplementation()!;\n  invoke.mockImplementation(async (command, args) => {\n    if (command === 'save_data_file') return saveResponse;\n    if (command === 'source_content') return sourceResponse;\n    return normalInvoke(command, args);\n  });\n"""
          if tests.count(old_mock) != 1:
              raise SystemExit(f'expected one structural save mock, found {tests.count(old_mock)}')
          tests = tests.replace(old_mock, new_mock, 1)

          conflict_marker = """  saveResponse = {\n    status: 'conflict',\n    snapshot: null,\n    current: { path: 'data.yaml', contentIdentity: 'external', source: 'external: true' },\n    diagnostic: { code: 'E-SOURCE-EDIT-CONFLICT', message: 'source changed' },\n  };\n"""
          conflict_replacement = conflict_marker + "  sourceResponse = { contentIdentity: 'external', source: 'external: true' };\n"
          if tests.count(conflict_marker) != 1:
              raise SystemExit(f'expected one conflict response marker, found {tests.count(conflict_marker)}')
          tests = tests.replace(conflict_marker, conflict_replacement, 1)
          test_path.write_text(tests)
          PY
      - run: npm run frontend:test
      - run: npm run frontend:build
      - name: Commit verified correction
        run: |
          rm .github/workflows/record-mutation-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gui/src/App.tsx apps/gui/tests/authoring.test.tsx .github/workflows/record-mutation-correction.yml
          git commit -m "record mutation final verification findingsを修正する"
          git push origin HEAD:main

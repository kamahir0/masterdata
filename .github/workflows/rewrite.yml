name: Clean-room implementation

on:
  push:
    branches: [rewrite/clean-room]
  pull_request:
    branches: [rewrite/clean-room]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shared semantics and independent oracle adapters
        run: cargo test --workspace --locked --features masterdata-engine/oracle-faults

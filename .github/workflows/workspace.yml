name: Workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check workspace
        run: python3 tools/check_workspace.py
      - name: Check whitespace
        run: git show --format= --check HEAD

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Rust cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: |
            src-tauri -> target
      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:native
      - name: Browser dependencies (macOS / Linux)
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium webkit
      - name: Browser dependencies (Windows WebView2 engine)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: UI regression (platform engines)
        run: npm run test:ui
      - name: Tauri package (macOS)
        if: runner.os == 'macOS'
        run: npm run pack -- --bundles app -- --locked
      - name: Tauri executable (Windows / Linux)
        if: runner.os != 'macOS'
        run: npm run pack -- --no-bundle -- --locked
      - name: Native startup (Linux)
        if: runner.os == 'Linux'
        # Xvfb has no GPU or desktop session. These flags are CI-only (https://github.com/tauri-apps/tauri/issues/15936).
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
          LIBGL_ALWAYS_SOFTWARE: 1
          GDK_BACKEND: x11
        run: dbus-run-session -- xvfb-run -a node scripts/smoke.mjs
      - name: Native startup (macOS / Windows)
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
      - name: Windows development install workflow
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\local-app\app.bat --no-launch
      - name: macOS development install workflow
        if: runner.os == 'macOS'
        run: |
          ./scripts/local-app/app.command --no-launch
          test ! -e 'src-tauri/target/release/bundle/macos/MasterData [Dev].app'
          test -x "$HOME/Applications/MasterData [Dev].app/Contents/MacOS/masterdata-desktop"
      - name: Failed GUI evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-failure-${{ matrix.os }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

name: Workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check workspace
        run: python3 tools/check_workspace.py
      - name: Check whitespace
        run: git show --format= --check HEAD

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Desktop regression (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - name: Desktop regression (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui

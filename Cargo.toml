[workspace]
resolver = "2"
members = [
    "crates/masterdata-core",
    "crates/masterdata-codegen-csharp",
    "crates/masterdata-dotnet",
    "crates/masterdata-cli",
    "crates/xtask",
    "apps/gui/src-tauri",
]
default-members = [
    "crates/masterdata-core",
    "crates/masterdata-codegen-csharp",
    "crates/masterdata-dotnet",
    "crates/masterdata-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["masterdata contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8"

